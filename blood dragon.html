<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Dragon</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===============================
           MAIN BACKGROUND
        =============================== */

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #5c0000,
                    transparent 25%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    #380000,
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #020000,
                    #130000,
                    #050000,
                    #240000,
                    #010000
                );

            background-size: 400% 400%;

            animation: bloodBackground 15s ease infinite;
        }


        @keyframes bloodBackground {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* ===============================
           RED ATMOSPHERIC GLOW
        =============================== */

        body::before {

            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: #8b0000;

            filter: blur(150px);

            opacity: 0.14;

            top: -180px;
            left: -150px;

            animation: bloodGlow 10s infinite alternate;

            z-index: -2;
        }


        @keyframes bloodGlow {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(350px, 280px);
            }

        }


        /* ===============================
           BLOOD MOON
        =============================== */

        .moon {

            position: fixed;

            top: 35px;
            right: 50px;

            width: 70px;
            height: 70px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 35%,
                    #ff5a5a,
                    #a00000 55%,
                    #250000 100%
                );

            box-shadow:
                0 0 20px #ff0000,
                0 0 60px rgba(255, 0, 0, 0.45);

            z-index: 1;

            animation: moonPulse 4s ease-in-out infinite alternate;
        }


        @keyframes moonPulse {

            from {
                box-shadow:
                    0 0 15px #ff0000,
                    0 0 40px rgba(255,0,0,.3);
            }

            to {
                box-shadow:
                    0 0 25px #ff0000,
                    0 0 80px rgba(255,0,0,.6);
            }

        }


        /* ===============================
           REALISTIC DRAGON
        =============================== */

        .dragon {

            position: fixed;

            width: 430px;
            height: 250px;

            left: -500px;
            top: 18%;

            z-index: 4;

            pointer-events: none;

            filter:
                drop-shadow(0 0 8px rgba(255,0,0,.8))
                drop-shadow(0 0 30px rgba(100,0,0,.8));

            animation: dragonFlight 18s linear infinite;
        }


        /* ===============================
           DRAGON BODY MOVEMENT
        =============================== */

        .dragon-body {

            transform-origin: 50% 55%;

            animation:
                dragonBreathing 2.8s ease-in-out infinite;
        }


        @keyframes dragonBreathing {

            0% {
                transform: scaleY(1);
            }

            50% {
                transform: scaleY(1.035);
            }

            100% {
                transform: scaleY(1);
            }

        }


        /* ===============================
           WINGS
        =============================== */

        .wing {

            transform-origin: 250px 120px;

            animation:
                wingFlap 1.4s ease-in-out infinite;
        }


        .wing-back {

            opacity: .55;

            animation-delay: .08s;
        }


        @keyframes wingFlap {

            0% {
                transform: rotateX(0deg) rotateZ(0deg);
            }

            50% {
                transform: rotateX(20deg) rotateZ(-4deg);
            }

            100% {
                transform: rotateX(0deg) rotateZ(0deg);
            }

        }


        /* ===============================
           DRAGON FLIGHT
        =============================== */

        @keyframes dragonFlight {

            0% {

                left: -500px;
                top: 22%;

                transform:
                    scale(.8)
                    rotate(-4deg);
            }


            15% {

                top: 15%;

                transform:
                    scale(.85)
                    rotate(2deg);
            }


            30% {

                top: 24%;

                transform:
                    scale(.9)
                    rotate(-2deg);
            }


            45% {

                top: 13%;

                transform:
                    scale(.95)
                    rotate(3deg);
            }


            60% {

                top: 22%;

                transform:
                    scale(1)
                    rotate(-2deg);
            }


            75% {

                top: 16%;

                transform:
                    scale(1.03)
                    rotate(2deg);
            }


            100% {

                left: 110%;

                top: 20%;

                transform:
                    scale(1.08)
                    rotate(0deg);
            }

        }


        /* ===============================
           DRAGON FIRE
        =============================== */

        .dragon-fire {

            position: fixed;

            left: -300px;
            top: 27%;

            width: 120px;
            height: 18px;

            z-index: 3;

            opacity: 0;

            filter:
                blur(1px)
                drop-shadow(0 0 12px #ff0000)
                drop-shadow(0 0 25px #8b0000);

            animation: fireFlight 18s linear infinite;
        }


        @keyframes fireFlight {

            0% {
                left: -300px;
                top: 27%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            30% {
                left: 30%;
                top: 24%;
            }

            50% {
                left: 55%;
                top: 31%;
            }

            75% {
                left: 80%;
                top: 22%;
            }

            100% {
                left: 110%;
                top: 25%;
                opacity: 0;
            }

        }


        /* ===============================
           FIRE PARTICLES
        =============================== */

        .fire-particle {

            fill: #ff0000;

            opacity: .9;

            animation:
                fireSpark 1s infinite alternate;
        }


        @keyframes fireSpark {

            from {
                opacity: .3;
                transform: scale(.6);
            }

            to {
                opacity: 1;
                transform: scale(1.2);
            }

        }


        /* ===============================
           BLOOD DROPS
        =============================== */

        .blood {

            position: fixed;

            top: -20px;

            width: 4px;
            height: 14px;

            background: #8b0000;

            border-radius: 50%;

            box-shadow:
                0 0 8px #ff0000;

            animation:
                bloodFall linear infinite;

            z-index: 1;

            pointer-events: none;
        }


        @keyframes bloodFall {

            0% {

                transform:
                    translateY(-20px)
                    scaleY(.7);

                opacity: 0;
            }


            10% {
                opacity: .8;
            }


            90% {
                opacity: .8;
            }


            100% {

                transform:
                    translateY(110vh)
                    scaleY(1.5);

                opacity: 0;
            }

        }


        /* ===============================
           INTRODUCTION
        =============================== */

        .intro {

            margin-top: 80px;

            padding: 15px 25px;

            border-radius: 12px;

            background:
                rgba(40,0,0,.35);

            border:
                1px solid rgba(255,0,0,.3);

            backdrop-filter:
                blur(12px);

            box-shadow:
                0 10px 40px rgba(0,0,0,.6);

            z-index: 5;

            text-align: center;
        }


        /* ===============================
           SMALL TITLE
        =============================== */

        .intro h1 {

            font-size: 22px;

            font-weight: 600;

            letter-spacing: 1px;

            color: #fff;

            text-shadow:
                0 0 8px rgba(255,0,0,.7);

            animation:
                titleGlow 3s infinite alternate;
        }


        @keyframes titleGlow {

            from {
                text-shadow:
                    0 0 5px rgba(255,0,0,.3);
            }

            to {
                text-shadow:
                    0 0 18px rgba(255,0,0,.9);
            }

        }


        /* ===============================
           NAVIGATION
        =============================== */

        .nav-link {

            display: block;

            width: 220px;

            padding: 11px;

            margin-top: 10px;

            text-align: center;

            text-decoration: none;

            color: #eee;

            font-size: 14px;

            font-weight: 600;

            border-radius: 8px;

            background:
                rgba(35,0,0,.55);

            border:
                1px solid rgba(255,0,0,.25);

            backdrop-filter:
                blur(8px);

            z-index: 5;

            transition:
                .3s ease;
        }


        .nav-link:hover {

            background:
                rgba(130,0,0,.65);

            color: white;

            transform:
                translateY(-2px);

            box-shadow:
                0 0 15px rgba(255,0,0,.6);

        }


        /* ===============================
           MOBILE
        =============================== */

        @media (max-width: 600px) {

            .intro {

                margin-top: 70px;

                padding:
                    13px 20px;
            }


            .intro h1 {

                font-size: 19px;
            }


            .nav-link {

                width: 200px;
            }


            .dragon {

                width: 300px;
                height: 180px;
            }


            .moon {

                width: 48px;
                height: 48px;

                top: 20px;
                right: 20px;
            }

        }

    </style>

</head>


<body>

    <!-- ===============================
         JAVASCRIPT
    =============================== -->

    <script>

        /* =================================
           BLOOD DROPS
        ================================= */

        for (let i = 0; i < 50; i++) {

            const drop =
                document.createElement("div");

            drop.className =
                "blood";

            drop.style.left =
                Math.random() * 100 + "vw";

            drop.style.animationDuration =
                (3 + Math.random() * 6) + "s";

            drop.style.animationDelay =
                Math.random() * 5 + "s";

            drop.style.width =
                (2 + Math.random() * 4) + "px";

            drop.style.height =
                (8 + Math.random() * 14) + "px";

            document.body.appendChild(drop);

        }


        /* =================================
           BLOOD EXPLOSION ON CLICK
        ================================= */

        document.addEventListener(
            "click",
            function(event) {

                for (let i = 0; i < 15; i++) {

                    const particle =
                        document.createElement("div");

                    particle.style.position =
                        "fixed";

                    particle.style.left =
                        event.clientX + "px";

                    particle.style.top =
                        event.clientY + "px";

                    particle.style.width =
                        "5px";

                    particle.style.height =
                        "5px";

                    particle.style.borderRadius =
                        "50%";

                    particle.style.background =
                        "#ff0000";

                    particle.style.boxShadow =
                        "0 0 10px #ff0000";

                    particle.style.pointerEvents =
                        "none";

                    particle.style.zIndex =
                        "100";


                    document.body.appendChild(
                        particle
                    );


                    const angle =
                        Math.random()
                        * Math.PI
                        * 2;


                    const distance =
                        Math.random()
                        * 100 + 30;


                    const x =
                        Math.cos(angle)
                        * distance;


                    const y =
                        Math.sin(angle)
                        * distance;


                    particle.animate(

                        [

                            {
                                transform:
                                    "translate(0,0) scale(1)",

                                opacity: 1
                            },

                            {

                                transform:
                                    `translate(${x}px,${y}px) scale(0)`,

                                opacity: 0
                            }

                        ],

                        {

                            duration: 700,

                            easing:
                                "ease-out"

                        }

                    );


                    setTimeout(
                        () => particle.remove(),
                        800
                    );

                }

            }
        );

    </script>
